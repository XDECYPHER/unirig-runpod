name: Build and Push UniRig Docker Image

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # ВАЖНО: у бесплатного GitHub-раннера всего ~14GB диска и ~7GB RAM.
    # Образ (CUDA devel + torch + flash_attn + веса на ~5.5GB) вплотную
    # подходит к этим лимитам. Если билд падает по месту на диске —
    # см. шаг "Free disk space" ниже, он уже включён по умолчанию.
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          docker system prune -af || true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set lowercase image name
        id: image
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # HF_TOKEN не обязателен (VAST-AI/UniRig — публичный репозиторий),
          # но пробрасываем на случай приватного зеркала/рейт-лимитов HF.
          build-args: |
            HF_TOKEN=${{ secrets.HF_TOKEN }}
          tags: |
            ghcr.io/${{ steps.image.outputs.name }}:latest
            ghcr.io/${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sanity check inside built image
        run: |
          IMAGE="ghcr.io/${{ steps.image.outputs.name }}:${{ github.sha }}"
          echo "=== numpy version ==="
          docker run --rm "$IMAGE" python3 -c "import numpy; print(numpy.__version__)"
          echo "=== bpy import ==="
          docker run --rm "$IMAGE" python3 -c "import bpy; print('bpy OK')"
          echo "=== libxkbcommon present? ==="
          docker run --rm "$IMAGE" bash -c "ldconfig -p | grep libxkbcommon || echo 'NOT FOUND'"
